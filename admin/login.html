<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - GMIF</title>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self';">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="login-body">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <span class="logo-text" style="font-size:1.8rem;color:var(--green-700)">GMIF</span>
        <span class="logo-subtitle" style="font-size:0.7rem;color:var(--gray-500)">Green Mount India Foundation</span>
      </div>
        <h1>Admin Login</h1>
        <p>Green Mount India Foundation</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter username" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn-login">Sign In</button>
        <p id="loginError" class="login-error"></p>
      </form>
      <div class="login-footer">
        <a href="../index.html">&larr; Back to Website</a>
      </div>
    </div>
  </div>
  <script src="auth.js"></script>
</body>
</html>
